<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1200" height="400" rx="0" fill="#17181d" stroke="none" stroke-width="0"/><text x="30" y="38" fill="#edd86e" font-size="20" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">The CAC Payback Period: When Does a Customer Turn Profitable?</text><rect x="30" y="44" width="1140" height="2" rx="0" fill="#edd86e" stroke="none" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">CAC $1,200. ARPA $100/mo at 100% gross margin. Break-even lands exactly at month 12.</text><rect x="60" y="160" width="1080" height="46" rx="6" fill="#1c1c20" stroke="#2d2d38" stroke-width="1"/><rect x="60" y="160" width="810.0" height="46" rx="6" fill="#220a0a" stroke="#ef4444" stroke-width="2"/><rect x="870.0" y="160" width="270.0" height="46" rx="6" fill="#0e2016" stroke="#22c55e" stroke-width="2"/><line x1="870.0" y1="140" x2="870.0" y2="226" stroke="#edd86e" stroke-width="2" stroke-dasharray="4,3"/><text x="870.0" y="132" fill="#edd86e" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">MONTH 12: BREAK-EVEN (CAC PAID OFF)</text><text x="465.0" y="189" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">OPERATING IN THE RED — RECOVERING CAC</text><text x="1005.0" y="189" fill="#22c55e" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">PURE GROSS PROFIT</text><text x="60.0" y="242" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Mo 0</text><text x="262.5" y="242" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Mo 3</text><text x="465.0" y="242" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Mo 6</text><text x="667.5" y="242" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Mo 9</text><text x="870.0" y="242" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Mo 12</text><text x="1072.5" y="242" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Mo 15</text><rect x="30" y="300" width="1140" height="62" rx="8" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="50" y="324" fill="#edd86e" font-size="12" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">THE KEY INSIGHT:</text><text x="50" y="344" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Every month under 12 is cash you’ve already spent and haven’t recovered. A payback period over 18 months means you’re funding growth with runway, not revenue.</text><text x="1170" y="370" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.com</text></svg>