<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1200" height="480" rx="0" fill="#17181d" stroke="none" stroke-width="0"/><text x="30" y="38" fill="#edd86e" font-size="20" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">NRR Is the Compounding Variable: Same Starting Cohort, 3 Years</text><rect x="30" y="44" width="1140" height="2" rx="0" fill="#edd86e" stroke="none" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Same $100K starting cohort. Zero new acquisition spend. NRR alone decides the outcome.</text><text x="255.0" y="84" fill="#ef4444" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">NRR < 100% — LEAKY BUCKET</text><rect x="90" y="185.55555555555557" width="90" height="194.44444444444443" rx="4" fill="#220a0a" stroke="#ef4444" stroke-width="2"/><text x="135.0" y="175.55555555555557" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">$100K</text><text x="135.0" y="402" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Year 1</text><rect x="210" y="224.44444444444443" width="90" height="155.55555555555557" rx="4" fill="#220a0a" stroke="#ef4444" stroke-width="2"/><text x="255.0" y="214.44444444444443" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">$80K</text><text x="255.0" y="402" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Year 2</text><rect x="330" y="263.3333333333333" width="90" height="116.66666666666667" rx="4" fill="#220a0a" stroke="#ef4444" stroke-width="2"/><text x="375.0" y="253.33333