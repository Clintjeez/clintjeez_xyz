edd86e" stroke-width="2"/><text x="50" y="432" fill="#edd86e" font-size="12" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">THE KEY INSIGHT:</text><text x="50" y="452" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">One cohort, zero new acquisition spend, two futures. NRR alone is the difference between a shrinking business and a compounding one.</text></svg>