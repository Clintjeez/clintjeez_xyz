<svg width="1200" height="530" viewBox="0 0 1200 530" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="530" fill="#17181d"/><text x="30" y="38" fill="#edd86e" font-size="22" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">What a GTM Engineer Actually Ships</text><rect x="30" y="44" width="1140" height="2" rx="0" fill="#edd86e" stroke="#edd86e" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Three systems. One connected revenue machine. Every tool feeds the next.</text><rect x="30" y="72" width="360" height="360" rx="8" fill="#091422" stroke="#4a9eed" stroke-width="3"/><text x="210" y="96" fill="#4a9eed" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">ACQUISITION INFRASTRUCTURE</text><rect x="46" y="102" width="328" height="2" rx="0" fill="#4a9eed" stroke="#4a9eed" stroke-width="0"/><text x="46" y="128" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Cold email: 3–5 sending domains</text><text x="46" y="172" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ SPF / DKIM / DMARC on every domain</text><text x="46" y="216" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ 21-day mailbox warmup protocol</text><text x="46" y="260" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Clay waterfall enrichment (Apollo → Hunter)</text><text x="46" y="304" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Email verification before every send</text><text x="46" y="348" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Programmatic SEO: Next.js dynamic routes</text><rect x="420" y="72" width="360" height="360" rx="8" fill="#0e2016" stroke="#22c55e" stroke-width="3"/><text x="600" y="96" fill="#22c55e" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">ACTIVATION + CONVERSION</text><rect x="436" y="102" width="328" height="2" rx="0" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="436" y="128" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ PostHog event taxonomy (every action)</text><text x="436" y="172" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Cohort A vs B activation analysis</text><text x="436" y="216" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ PQL threshold definition & scoring</text><text x="436" y="260" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ n8n stall trigger → 4hr Loom email</text><text x="436" y="304" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Automated Slack alert at PQL threshold</text><text x="436" y="348" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Behavioral upgrade sequence before trial end</text><rect x="810" y="72" width="360" height="360" rx="8" fill="#180e2a" stroke="#8b5cf6" stroke-width="3"/><text x="990" y="96" fill="#8b5cf6" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">RETENTION + REVENUE</text><rect x="826" y="102" width="328" height="2" rx="0" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="0"/><text x="826" y="128" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Customer health score (login+features)</text><text x="826" y="172" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Churn-risk alert → n8n → Slack/HubSpot</text><text x="826" y="216" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Pricing infrastructure: usage-based triggers</text><text x="826" y="260" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Stripe + PostHog connected</text><text x="826" y="304" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Dunning logic with smart payment retry</text><text x="826" y="348" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Expansion email at usage threshold</text><line x1="390" y1="252" x2="414" y2="252" stroke="#edd86e" stroke-width="2"/><polygon points="414,246 420,252 414,258" fill="#edd86e"/><line x1="780" y1="252" x2="804" y2="252" stroke="#edd86e" stroke-width="2"/><polygon points="804,246 810,252 804,258" fill="#edd86e"/><rect x="30" y="450" width="1140" height="52" rx="8" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="46" y="476" fill="#edd86e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Key insight:</text><text x="152" y="476" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Any one tool used in isolation produces mediocre results. The leverage is in the orchestration.</text><text x="1186" y="518" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.xyz</text></svg>