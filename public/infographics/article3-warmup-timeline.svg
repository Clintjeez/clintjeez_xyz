<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg"><rect width="1000" height="420" fill="#17181d"/><text x="30" y="38" fill="#edd86e" font-size="22" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Mailbox Warmup Timeline: The 21-Day Protocol</text><rect x="30" y="44" width="960" height="2" rx="0" fill="#edd86e" stroke="#edd86e" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Rush this and your domain is flagged within 72 hours. No shortcuts.</text><rect x="30" y="78" width="110" height="52" rx="6" fill="#0e2016" stroke="#22c55e" stroke-width="2"/><text x="85" y="106" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Days 1–7</text><rect x="150" y="86" width="1344" height="36" rx="4" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="1502" y="108" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">5–10 emails/day</text><text x="158" y="136" fill="#777778" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Establish reputation with warmup pool</text><rect x="30" y="154" width="110" height="52" rx="6" fill="#221808" stroke="#f59e0b" stroke-width="2"/><text x="85" y="182" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Days 8–14</text><rect x="150" y="162" width="2016" height="36" rx="4" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><text x="2174" y="184" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">15–20 emails/day</text><text x="158" y="212" fill="#777778" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Monitor spam placement via Postmaster Tools</text><rect x="30" y="230" width="110" height="52" rx="6" fill="#091422" stroke="#4a9eed" stroke-width="2"/><text x="85" y="258" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Days 15–21</text><rect x="150" y="238" width="2800" height="36" rx="4" fill="#4a9eed" stroke="#4a9eed" stroke-width="0"/><text x="2958" y="260" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">25–30 emails/day</text><text x="158" y="288" fill="#777778" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Ramp complete — verify deliverability score</text><rect x="30" y="306" width="110" height="52" rx="6" fill="#180e2a" stroke="#8b5cf6" stroke-width="2"/><text x="85" y="334" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Day 21+</text><rect x="150" y="314" width="4256" height="36" rx="4" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="0"/><text x="4414" y="336" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">30–40 MAX/day</text><text x="158" y="364" fill="#777778" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Cold email live. Never exceed 50. Ever.</text><rect x="30" y="376" width="940" height="36" rx="6" fill="#220a0a" stroke="#ef4444" stroke-width="2"/><text x="46" y="400" fill="#ef4444" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">⚠  Hard limit: Never exceed 50 cold emails per day per mailbox — reputation damage is hard to reverse.</text><text x="986" y="408" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.com</text></svg>