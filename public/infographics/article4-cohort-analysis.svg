<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="500" fill="#17181d"/><text x="30" y="38" fill="#edd86e" font-size="22" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">The Cohort Analysis Method: Finding Your Aha Moment</text><rect x="30" y="44" width="1140" height="2" rx="0" fill="#edd86e" stroke="#edd86e" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Pull your last 20–30 retained users. Map every action in their first 72 hours. Compare to churned cohort.</text><rect x="30" y="70" width="490" height="310" rx="8" fill="#0e2016" stroke="#22c55e" stroke-width="2"/><text x="275" y="98" fill="#22c55e" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">COHORT A</text><text x="275" y="116" fill="#777778" font-size="12" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Paid + Active at 90 days</text><rect x="50" y="122" width="450" height="1" rx="0" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="52" y="148" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="76" y="148" fill="#ffffff" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Signed up + verified email</text><text x="52" y="186" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="76" y="186" fill="#ffffff" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Connected primary integration</text><text x="52" y="224" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="76" y="224" fill="#ffffff" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Created first real project/record</text><text x="52" y="262" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">★</text><text x="76" y="262" fill="#22c55e" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Invited a team member</text><text x="52" y="300" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">★</text><text x="76" y="300" fill="#22c55e" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">AHA MOMENT: first result achieved</text><text x="52" y="338" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="76" y="338" fill="#ffffff" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Returned within 48hrs</text><rect x="540" y="70" width="120" height="310" rx="8" fill="#222326" stroke="#2d2d38" stroke-width="1"/><text x="600" y="200" fill="#edd86e" font-size="28" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">VS</text><text x="600" y="232" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">COMPARE</text><text x="600" y="250" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">these paths</text><rect x="680" y="70" width="490" height="310" rx="8" fill="#220a0a" stroke="#ef4444" stroke-width="2"/><text x="925" y="98" fill="#ef4444" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">COHORT B</text><text x="925" y="116" fill="#777778" font-size="12" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Churned in Month 1</text><rect x="700" y="122" width="450" height="1" rx="0" fill="#ef4444" stroke="#ef4444" stroke-width="0"/><text x="700" y="148" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="724" y="148" fill="#ffffff" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Signed up + verified email</text><text x="700" y="186" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="724" y="186" fill="#ffffff" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Connected primary integration</text><text x="700" y="224" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="724" y="224" fill="#ffffff" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Created first real project/record</text><text x="700" y="262" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✗</text><text x="724" y="262" fill="#ef4444" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">DROPPED OFF — never invited team</text><text x="700" y="300" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✗</text><text x="724" y="300" fill="#ef4444" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Never hit aha moment</text><text x="700" y="338" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✗</text><text x="724" y="338" fill="#ef4444" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Did not return within 48hrs</text><rect x="30" y="400" width="1140" height="52" rx="8" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="46" y="422" fill="#edd86e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Divergence point:</text><text x="196" y="422" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">The action Cohort A completes that Cohort B skips is your activation bottleneck. That is your aha moment.</text><text x="1186" y="488" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.com</text></svg>