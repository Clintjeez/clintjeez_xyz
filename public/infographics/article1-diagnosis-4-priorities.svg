<svg width="1200" height="540" viewBox="0 0 1200 540" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="540" fill="#17181d"/><text x="30" y="40" fill="#edd86e" font-size="22" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">The 4 Growth Levers: Diagnosis Priority Order</text><rect x="30" y="48" width="1140" height="2" rx="0" fill="#edd86e" stroke="#edd86e" stroke-width="0"/><text x="30" y="68" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Run these checks before spending another dollar on acquisition.</text><rect x="30" y="85" width="1140" height="92" rx="8" fill="#0e2016" stroke="#22c55e" stroke-width="2"/><rect x="30" y="85" width="70" height="92" rx="8" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="65" y="137" fill="#17181d" font-size="20" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">01</text><text x="116" y="113" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">ACTIVATION</text><text x="116" y="135" fill="#22c55e" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Avg 37.5%  |  Most SaaS: 20–25%</text><text x="116" y="155" fill="#777778" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">↳ Users sign up and ghost before hitting the aha moment.</text><rect x="640" y="97" width="520" height="68" rx="6" fill="#17181d" stroke="#2d2d38" stroke-width="1"/><text x="656" y="115" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">FIX:</text><text x="693" y="115" fill="#bfbfbf" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">PostHog funnel + cohort analysis → behavioral email tri</text><text x="656" y="133" fill="#bfbfbf" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">gger at stall point</text><rect x="30" y="193" width="1140" height="92" rx="8" fill="#221808" stroke="#f59e0b" stroke-width="2"/><rect x="30" y="193" width="70" height="92" rx="8" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><text x="65" y="245" fill="#17181d" font-size="20" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">02</text><text x="116" y="221" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">CONVERSION</text><text x="116" y="243" fill="#f59e0b" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">B2B Median: 18.5%  |  Top performers: 35–45%</text><text x="116" y="263" fill="#777778" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">↳ Trial graveyard — signups never convert to paid.</text><rect x="640" y="205" width="520" height="68" rx="6" fill="#17181d" stroke="#2d2d38" stroke-width="1"/><text x="656" y="223" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">FIX:</text><text x="693" y="223" fill="#bfbfbf" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Define PQL threshold → automated Slack alert → timed up</text><text x="656" y="241" fill="#bfbfbf" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">grade sequence</text><rect x="30" y="301" width="1140" height="92" rx="8" fill="#220a0a" stroke="#ef4444" stroke-width="2"/><rect x="30" y="301" width="70" height="92" rx="8" fill="#ef4444" stroke="#ef4444" stroke-width="0"/><text x="65" y="353" fill="#17181d" font-size="20" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">03</text><text x="116" y="329" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">RETENTION</text><text x="116" y="351" fill="#ef4444" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">5%+ monthly churn = treadmill, not a business</text><text x="116" y="371" fill="#777778" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">↳ Churn is invisible until the cancellation arrives 30 days late.</text><rect x="640" y="313" width="520" height="68" rx="6" fill="#17181d" stroke="#2d2d38" stroke-width="1"/><text x="656" y="331" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">FIX:</text><text x="693" y="331" fill="#bfbfbf" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Customer health score in PostHog → n8n churn-risk alert</text><text x="656" y="349" fill="#bfbfbf" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace"> → human touchpoint</text><rect x="30" y="409" width="1140" height="92" rx="8" fill="#180e2a" stroke="#8b5cf6" stroke-width="2"/><rect x="30" y="409" width="70" height="92" rx="8" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="0"/><text x="65" y="461" fill="#17181d" font-size="20" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">04</text><text x="116" y="437" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">REVENUE EXP.</text><text x="116" y="459" fill="#8b5cf6" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">1% pricing improvement = 11% profit uplift</text><text x="116" y="479" fill="#777778" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">↳ Pricing hasn't changed since launch — leaving revenue on every invoice.</text><rect x="640" y="421" width="520" height="68" rx="6" fill="#17181d" stroke="#2d2d38" stroke-width="1"/><text x="656" y="439" fill="#8b5cf6" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">FIX:</text><text x="693" y="439" fill="#bfbfbf" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Define value metric → usage-based expansion trigger → u</text><text x="656" y="457" fill="#bfbfbf" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">pgrade prompt at threshold</text><rect x="30" y="518" width="1140" height="52" rx="8" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="46" y="549" fill="#edd86e" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace"></text><text x="1186" y="520" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.xyz</text></svg>