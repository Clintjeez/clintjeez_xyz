<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1200" height="900" rx="0" fill="#17181d" stroke="none" stroke-width="0"/><text x="30" y="40" fill="#edd86e" font-size="22" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">The Lead Qualification Gateway: From Signup to SQL</text><rect x="30" y="48" width="1140" height="2" rx="0" fill="#edd86e" stroke="none" stroke-width="0"/><text x="30" y="68" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Every lead is parsed, enriched, scored, and routed — like a request through an API gateway.</text><rect x="30" y="92" width="1140" height="92" rx="8" fill="#1c1c20" stroke="#3a3a3f" stroke-width="2"/><rect x="30" y="92" width="14" height="92" rx="8" fill="#3a3a3f" stroke="none" stroke-width="0"/><text x="64" y="126" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">RAW SIGNUPS</text><text x="64" y="150" fill="#777778" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Undifferentiated top-of-funnel. No filter applied yet.</text><line x1="600.0" y1="184" x2="600.0" y2="194" stroke="#777778" stroke-width="2"/><polygon points="594.0,194 606.0,194 600.0,202 " fill="#777778"/><rect x="30" y="202" width="1140" height="92" rx="8" fill="#221808" stroke="#8a6d1f" stroke-width="2"/><rect x="30" y="202" width="14" height="92" rx="8" fill="#8a6d1f" stroke="none" stroke-width="0"/><text x="64" y="236" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">ICP ENRICHMENT</text><text x="64" y="260" fill="#777778" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Webhook fires domain to Clearbit/Apollo. Pulls headcount, funding, tech stack.</text><text x="730" y="236" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">FAILS CRITERIA → NURTURE SEQUENCE</text><line x1="600.0" y1="294" x2="600.0" y2="304" stroke="#777778" stroke-width="2"/><polygon points="594.0,304 606.0,304 600.0,312 " fill="#777778"/><rect x="30" y="312" width="1140" height="92" rx="8" fill="#0d1b2e" stroke="#2563eb" stroke-width="2"/><rect x="30" y="312" width="14" height="92" rx="8" fill="#2563eb" stroke="none" stroke-width="0"/><text x="64" y="346" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">BEHAVIORAL TELEMETRY</text><text x="64" y="370" fill="#777778" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Usage events score the account: doc visits, trial actions, team invites.</text><line x1="600.0" y1="404" x2="600.0" y2="414" stroke="#777778" stroke-width="2"/><polygon points="594.0,414 606.0,414 600.0,422 " fill="#777778"/><rect x="30" y="422" width="1140" height="92" rx="8" fill="#221808" stroke="#f59e0b" stroke-width="2"/><rect x="30" y="422" width="14" height="92" rx="8" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="64" y="456" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">MQL THRESHOLD</text><text x="64" y="480" fill="#777778" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Score crosses 70+. Growth team notified via Slack automatically.</text><line x1="600.0" y1="514" x2="600.0" y2="524" stroke="#777778" stroke-width="2"/><polygon points="594.0,524 606.0,524 600.0,532 " fill="#777778"/><rect x="30" y="532" width="1140" height="92" rx="8" fill="#180e2a" stroke="#8b5cf6" stroke-width="2"/><rect x="30" y="532" width="14" height="92" rx="8" fill="#8b5cf6" stroke="none" stroke-width="0"/><text x="64" y="566" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">BANT / MEDDIC FRAMEWORK</text><text x="64" y="590" fill="#777778" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">ACV band selects the checklist. Confirms budget, authority, intent.</text><line x1="600.0" y1="624" x2="600.0" y2="634" stroke="#777778" stroke-width="2"/><polygon points="594.0,634 606.0,634 600.0,642 " fill="#777778"/><rect x="30" y="642" width="1140" height="92" rx="8" fill="#0e2016" stroke="#22c55e" stroke-width="2"/><rect x="30" y="642" width="14" height="92" rx="8" fill="#22c55e" stroke="none" stroke-width="0"/><text x="64" y="676" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">SQL → ROUTED TO AE</text><text x="64" y="700" fill="#777778" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Deal record auto-created in HubSpot/Salesforce. AE gets a discovery template.</text><rect x="30" y="762" width="1140" height="76" rx="8" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="50" y="790" fill="#edd86e" font-size="12" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">THE KEY INSIGHT:</text><text x="50" y="812" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Every stage is a filter, not a formality. A lead that skips a stage isn’t qualified — it’s</text><text x="50" y="828" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">just unscored, and unscored leads are what starts the Slack fight between marketing and sales.</text><text x="1170" y="855" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.com</text></svg>