<svg width="1200" height="440" viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="440" fill="#17181d"/><text x="30" y="38" fill="#edd86e" font-size="22" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">GTM Engineer vs. Other Revenue Roles</text><rect x="30" y="44" width="1140" height="2" rx="0" fill="#edd86e" stroke="#edd86e" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Similar-sounding titles. Completely different scope and depth.</text><rect x="30" y="72" width="1140" height="34" rx="6" fill="#222326" stroke="#2d2d38" stroke-width="1"/><text x="42" y="94" fill="#777778" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">ROLE</text><text x="242" y="94" fill="#777778" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">PRIMARY FOCUS</text><text x="542" y="94" fill="#777778" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">TECHNICAL DEPTH</text><text x="792" y="94" fill="#777778" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">REVENUE OWNERSHIP</text><rect x="30" y="112" width="1140" height="56" rx="6" fill="#17181d" stroke="#2d2d38" stroke-width="1"/><text x="42" y="146" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Growth Marketer</text><text x="242" y="146" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Campaigns, content, paid channels</text><text x="542" y="146" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Low–medium</text><text x="792" y="146" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Top-of-funnel only</text><rect x="30" y="178" width="1140" height="56" rx="6" fill="#17181d" stroke="#2d2d38" stroke-width="1"/><text x="42" y="212" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Sales Engineer</text><text x="242" y="212" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Pre-sales demos, solutions design</text><text x="542" y="212" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">High</text><text x="792" y="212" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Deal support only</text><rect x="30" y="244" width="1140" height="56" rx="6" fill="#17181d" stroke="#2d2d38" stroke-width="1"/><text x="42" y="278" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">RevOps Manager</text><text x="242" y="278" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">CRM, reporting, pipeline hygiene</text><text x="542" y="278" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Medium</text><text x="792" y="278" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Process and data only</text><rect x="30" y="310" width="1140" height="56" rx="6" fill="#221808" stroke="#edd86e" stroke-width="2"/><text x="42" y="344" fill="#edd86e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">GTM ENGINEER</text><text x="242" y="344" fill="#edd86e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Full-lifecycle infrastructure</text><text x="542" y="344" fill="#edd86e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">HIGH</text><text x="792" y="344" fill="#edd86e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Acquisition → Retention</text><rect x="30" y="388" width="1140" height="30" rx="6" fill="#222326" stroke="#2d2d38" stroke-width="1"/><text x="46" y="408" fill="#edd86e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Strategy is cheap. Infrastructure is the moat.</text><text x="1186" y="428" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.com</text></svg>