<svg width="900" height="680" viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="680" fill="#17181d"/><text x="30" y="38" fill="#edd86e" font-size="22" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">n8n Behavioral Trigger: Activation Email Workflow</text><rect x="30" y="44" width="840" height="2" rx="0" fill="#edd86e" stroke="#edd86e" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Fires on user behavior, not a time delay. One precise trigger outperforms ten generic drips.</text><rect x="280" y="75" width="340" height="56" rx="8" fill="#091422" stroke="#4a9eed" stroke-width="2"/><text x="450" y="99" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">User Completes Step N</text><text x="450" y="117" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">PostHog event fires → n8n webhook triggers</text><line x1="450" y1="131" x2="450" y2="145" stroke="#4a9eed" stroke-width="2"/><polygon points="444,145 450,151 456,145" fill="#4a9eed"/><rect x="280" y="151" width="340" height="56" rx="8" fill="#222326" stroke="#2d2d38" stroke-width="2"/><text x="450" y="175" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">n8n: Start 4-Hour Timer</text><text x="450" y="193" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Waiting to check Step N+1 completion</text><line x1="450" y1="207" x2="450" y2="221" stroke="#777778" stroke-width="2"/><polygon points="444,221 450,227 456,221" fill="#777778"/><polygon points="450,227 620,261 450,295 280,261" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="450" y="257" fill="#edd86e" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Step N+1 completed?</text><text x="450" y="273" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">(within 4 hours)</text><text x="640" y="266" fill="#22c55e" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">YES →</text><line x1="620" y1="261" x2="674" y2="261" stroke="#22c55e" stroke-width="2"/><polygon points="674,255 680,261 674,267" fill="#22c55e"/><rect x="680" y="241" width="170" height="40" rx="6" fill="#0e2016" stroke="#22c55e" stroke-width="2"/><text x="765" y="266" fill="#22c55e" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">✓ Activated</text><text x="460" y="307" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">NO ↓</text><line x1="450" y1="295" x2="450" y2="309" stroke="#ef4444" stroke-width="2"/><polygon points="444,309 450,315 456,309" fill="#ef4444"/><rect x="280" y="315" width="340" height="56" rx="8" fill="#221808" stroke="#f59e0b" stroke-width="2"/><text x="450" y="339" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Email 1 — 4-Hour Stall</text><text x="450" y="357" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Loom walkthrough + direct link back to Step N+1</text><line x1="450" y1="371" x2="450" y2="385" stroke="#777778" stroke-width="2"/><polygon points="444,385 450,391 456,385" fill="#777778"/><polygon points="450,391 620,425 450,459 280,425" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="450" y="430" fill="#edd86e" font-size="13" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Still stalled at 24hrs?</text><text x="460" y="471" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">NO ↓</text><line x1="450" y1="459" x2="450" y2="473" stroke="#ef4444" stroke-width="2"/><polygon points="444,473 450,479 456,473" fill="#ef4444"/><rect x="280" y="479" width="340" height="56" rx="8" fill="#091422" stroke="#4a9eed" stroke-width="2"/><text x="450" y="503" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Email 2 — 24-Hour Stall</text><text x="450" y="521" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Remove friction. Alternate path or sample data.</text><line x1="450" y1="535" x2="450" y2="549" stroke="#777778" stroke-width="2"/><polygon points="444,549 450,555 456,549" fill="#777778"/><rect x="280" y="555" width="340" height="56" rx="8" fill="#180e2a" stroke="#8b5cf6" stroke-width="2"/><text x="450" y="579" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Email 3 — 72-Hour Stall</text><text x="450" y="597" fill="#777778" font-size="11" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Offer 15-min setup call → cal.com booking link</text><rect x="30" y="629" width="840" height="44" rx="8" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="46" y="657" fill="#edd86e" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Behavioral triggers beat time-based triggers. Build this once — it runs without intervention.</text><text x="886" y="668" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.com</text></svg>