<svg width="1200" height="490" viewBox="0 0 1200 490" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="490" fill="#17181d"/><text x="30" y="38" fill="#edd86e" font-size="22" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Cold Email Infrastructure: The 5-Component Stack</text><rect x="30" y="44" width="1140" height="2" rx="0" fill="#edd86e" stroke="#edd86e" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Skip one component and the entire system fails. This is the non-negotiable build order.</text><rect x="30" y="72" width="206" height="330" rx="8" fill="#091422" stroke="#4a9eed" stroke-width="2"/><rect x="30" y="72" width="206" height="32" rx="8" fill="#4a9eed" stroke="#4a9eed" stroke-width="0"/><rect x="30" y="88" width="206" height="16" rx="0" fill="#4a9eed" stroke="#4a9eed" stroke-width="0"/><text x="133" y="92" fill="#17181d" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">STEP 01</text><text x="133" y="120" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">SENDING</text><text x="133" y="140" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">DOMAINS</text><rect x="42" y="145" width="182" height="1" rx="0" fill="#4a9eed" stroke="#4a9eed" stroke-width="0"/><text x="42" y="165" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ 3–5 per active sender</text><text x="42" y="193" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Never your primary domain</text><text x="42" y="221" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ get[co].com / try[co].com</text><text x="42" y="249" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ SPF: authorized IPs</text><text x="42" y="277" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ DKIM: crypto signature</text><text x="42" y="305" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ DMARC: auth policy</text><line x1="236" y1="237" x2="252" y2="237" stroke="#4a9eed" stroke-width="2"/><polygon points="252,231 258,237 252,243" fill="#4a9eed"/><rect x="258" y="72" width="206" height="330" rx="8" fill="#0e2016" stroke="#22c55e" stroke-width="2"/><rect x="258" y="72" width="206" height="32" rx="8" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><rect x="258" y="88" width="206" height="16" rx="0" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="361" y="92" fill="#17181d" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">STEP 02</text><text x="361" y="120" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">MAILBOX</text><text x="361" y="140" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">WARMUP</text><rect x="270" y="145" width="182" height="1" rx="0" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="270" y="165" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ 1–2 mailboxes/domain</text><text x="270" y="193" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ first.last format only</text><text x="270" y="221" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Days 1–7: 5–10/day</text><text x="270" y="249" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Days 8–14: 15–20/day</text><text x="270" y="277" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Days 15–21: 25–30/day</text><text x="270" y="305" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Day 21+: max 40/day</text><line x1="464" y1="237" x2="480" y2="237" stroke="#22c55e" stroke-width="2"/><polygon points="480,231 486,237 480,243" fill="#22c55e"/><rect x="486" y="72" width="206" height="330" rx="8" fill="#221808" stroke="#f59e0b" stroke-width="2"/><rect x="486" y="72" width="206" height="32" rx="8" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><rect x="486" y="88" width="206" height="16" rx="0" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><text x="589" y="92" fill="#17181d" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">STEP 03</text><text x="589" y="120" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">LEAD</text><text x="589" y="140" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">ENRICHMENT</text><rect x="498" y="145" width="182" height="1" rx="0" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><text x="498" y="165" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Clay waterfall logic</text><text x="498" y="193" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Apollo → Hunter</text><text x="498" y="221" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ → Findymail → Datagma</text><text x="498" y="249" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Verify w/ NeverBounce</text><text x="498" y="277" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Accept only 'Valid'</text><text x="498" y="305" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Reject 'catch-all'</text><line x1="692" y1="237" x2="708" y2="237" stroke="#f59e0b" stroke-width="2"/><polygon points="708,231 714,237 708,243" fill="#f59e0b"/><rect x="714" y="72" width="206" height="330" rx="8" fill="#180e2a" stroke="#8b5cf6" stroke-width="2"/><rect x="714" y="72" width="206" height="32" rx="8" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="0"/><rect x="714" y="88" width="206" height="16" rx="0" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="0"/><text x="817" y="92" fill="#17181d" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">STEP 04</text><text x="817" y="120" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">SEQUENCING</text><text x="817" y="140" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">PLATFORM</text><rect x="726" y="145" width="182" height="1" rx="0" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="0"/><text x="726" y="165" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Instantly / Smartlead</text><text x="726" y="193" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Multi-mailbox rotation</text><text x="726" y="221" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Email 1: Day 1 (problem)</text><text x="726" y="249" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Email 2: Day 4 (angle)</text><text x="726" y="277" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Email 3: Day 8 (close)</text><text x="726" y="305" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Under 100 words each</text><line x1="920" y1="237" x2="936" y2="237" stroke="#8b5cf6" stroke-width="2"/><polygon points="936,231 942,237 936,243" fill="#8b5cf6"/><rect x="942" y="72" width="206" height="330" rx="8" fill="#220a0a" stroke="#ef4444" stroke-width="2"/><rect x="942" y="72" width="206" height="32" rx="8" fill="#ef4444" stroke="#ef4444" stroke-width="0"/><rect x="942" y="88" width="206" height="16" rx="0" fill="#ef4444" stroke="#ef4444" stroke-width="0"/><text x="1045" y="92" fill="#17181d" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">STEP 05</text><text x="1045" y="120" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">N8N</text><text x="1045" y="140" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">ORCHESTRATION</text><rect x="954" y="145" width="182" height="1" rx="0" fill="#ef4444" stroke="#ef4444" stroke-width="0"/><text x="954" y="165" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Reply → HubSpot deal</text><text x="954" y="193" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Slack alert to inbox</text><text x="954" y="221" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Positive → Cal.com link</text><text x="954" y="249" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ No reply (3x) → 30-day</text><text x="954" y="277" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ re-engage sequence</text><text x="954" y="305" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→ Zero manual steps</text><rect x="30" y="422" width="1140" height="42" rx="8" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="46" y="448" fill="#edd86e" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Before fixing your copy, fix your infrastructure. Most cold email fails are deliverability failures, not writing failures.</text><text x="1186" y="478" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.com</text></svg>