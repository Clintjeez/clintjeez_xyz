<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1200" height="560" rx="0" fill="#17181d" stroke="none" stroke-width="0"/><text x="30" y="38" fill="#edd86e" font-size="20" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">BANT vs. MEDDIC: Which Qualification Framework Fits Your ACV</text><rect x="30" y="44" width="1140" height="2" rx="0" fill="#edd86e" stroke="none" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Pick the framework by deal size, not by preference. Mismatched frameworks under- or over-qualify leads.</text><rect x="30" y="82" width="545" height="380" rx="8" fill="#0d1b2e" stroke="#2563eb" stroke-width="2"/><text x="302.5" y="112" fill="#2563eb" font-size="18" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">BANT</text><text x="302.5" y="132" fill="#777778" font-size="12" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">ACV under $20K — self-serve / mid-market</text><rect x="50" y="140" width="505" height="1" fill="#2563eb"/><text x="60" y="172" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="86" y="172" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Budget</text><text x="86" y="192" fill="#777778" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Funds allocated to pay for this today?</text><text x="60" y="244" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="86" y="244" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Authority</text><text x="86" y="264" fill="#777778" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Talking to whoever holds signing power?</text><text x="60" y="316" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="86" y="316" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Need</text><text x="86" y="336" fill="#777778" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Acute operational pain, right now?</text><text x="60" y="388" fill="#2563eb" font-size="15" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="86" y="388" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Timeline</text><text x="86" y="408" fill="#777778" font-size="11" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Implementing in the next 30–90 days?</text><rect x="625" y="82" width="545" height="380" rx="8" fill="#180e2a" stroke="#8b5cf6" stroke-width="2"/><text x="897.5" y="112" fill="#8b5cf6" font-size="18" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">MEDDIC</text><text x="897.5" y="132" fill="#777778" font-size="12" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">ACV $50K–$100K+ — enterprise</text><rect x="645" y="140" width="505" height="1" fill="#8b5cf6"/><text x="655" y="164" fill="#8b5cf6" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="681" y="164" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Metrics</text><text x="681" y="181" fill="#777778" font-size="10" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Quantifiable economic gain they’ll achieve?</text><text x="655" y="215" fill="#8b5cf6" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="681" y="215" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Economic Buyer</text><text x="681" y="232" fill="#777778" font-size="10" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Who holds financial authority to fund this?</text><text x="655" y="266" fill="#8b5cf6" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="681" y="266" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Decision Criteria</text><text x="681" y="283" fill="#777778" font-size="10" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Technical/security benchmarks vs competitors?</text><text x="655" y="317" fill="#8b5cf6" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="681" y="317" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Decision Process</text><text x="681" y="334" fill="#777778" font-size="10" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Legal, compliance, procurement steps?</text><text x="655" y="368" fill="#8b5cf6" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="681" y="368" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Identify Pain</text><text x="681" y="385" fill="#777778" font-size="10" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Business failure if they do nothing?</text><text x="655" y="419" fill="#8b5cf6" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="681" y="419" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Champion</text><text x="681" y="436" fill="#777778" font-size="10" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Who’s fighting internally for you to win?</text><rect x="30" y="476" width="1140" height="62" rx="8" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="50" y="500" fill="#edd86e" font-size="12" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">THE KEY INSIGHT:</text><text x="50" y="520" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Running MEDDIC on a $5K self-serve deal kills velocity. Running BANT on a $100K deal skips the buyer map — and the deal stalls in legal.</text><text x="1170" y="545" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.com</text></svg>