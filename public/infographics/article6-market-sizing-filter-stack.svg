<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1200" height="560" rx="0" fill="#17181d" stroke="none" stroke-width="0"/><text x="30" y="40" fill="#edd86e" font-size="22" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">The Market Sizing Filter Stack: TAM &#8594; SAM &#8594; SOM</text><rect x="30" y="48" width="1140" height="2" rx="0" fill="#edd86e" stroke="none" stroke-width="0"/><text x="30" y="68" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Three sequential filters on the same data lake. Only the last one feeds your GTM stack.</text><rect x="30" y="92" width="1140" height="100" rx="8" fill="#1c1c20" stroke="#3a3a3f" stroke-width="2"/><rect x="30" y="92" width="90" height="100" rx="8" fill="#3a3a3f" stroke="none" stroke-width="0"/><text x="75" y="150" fill="#17181d" font-size="20" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">TAM</text><text x="142" y="122" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Total Addressable Market &#8212; the unfiltered table</text><text x="142" y="144" fill="#777778" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Every company on Earth that could theoretically use software like yours.</text><text x="142" y="174" fill="#bfbfbf" font-size="12" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">EX: $50B global project management software spend</text><rect x="30" y="210" width="860" height="100" rx="8" fill="#221808" stroke="#8a6d1f" stroke-width="2"/><rect x="30" y="210" width="90" height="100" rx="8" fill="#8a6d1f" stroke="none" stroke-width="0"/><text x="75" y="268" fill="#17181d" font-size="20" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">SAM</text><text x="142" y="240" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Serviceable Addressable Market &#8212; filtered by WHERE clause</text><text x="142" y="262" fill="#777778" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Reachable given your tech stack, geography, compliance, and language.</text><text x="142" y="292" fill="#bfbfbf" font-size="12" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">EX: Shopify merchants, US-based, USD billing &#8594; $1.2B</text><rect x="30" y="328" width="560" height="100" rx="8" fill="#0e2016" stroke="#22c55e" stroke-width="2"/><rect x="30" y="328" width="90" height="100" rx="8" fill="#22c55e" stroke="none" stroke-width="0"/><text x="75" y="386" fill="#17181d" font-size="20" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">SOM</text><text x="142" y="358" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Serviceable Obtainable Market &#8212; filtered by LIMIT + your capacity</text><text x="142" y="380" fill="#777778" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">What your current sales, growth budget, and engineering bandwidth can capture in 12&#8211;18 months.</text><text x="142" y="410" fill="#22c55e" font-size="12" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">EX: 400 target accounts, enriched via Clay &#8594; $18M realistic SOM</text><rect x="30" y="452" width="1140" height="76" rx="8" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="50" y="480" fill="#edd86e" font-size="12" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">THE KEY INSIGHT:</text><text x="50" y="502" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">SOM is the only number that should ever touch your enrichment scripts, ad targeting, or outbound cadence.</text><text x="50" y="518" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">TAM is a slide. SOM is a query.</text><text x="1170" y="545" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.com</text></svg>