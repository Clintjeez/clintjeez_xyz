<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg"><rect width="1000" height="500" fill="#17181d"/><text x="30" y="38" fill="#edd86e" font-size="22" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">The GTM Engineer: At the Intersection of Three Disciplines</text><rect x="30" y="44" width="960" height="2" rx="0" fill="#edd86e" stroke="#edd86e" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Not a marketer who learned tools. Not an engineer who ignores revenue. Both, in one role.</text><rect x="30" y="75" width="280" height="310" rx="8" fill="#091422" stroke="#4a9eed" stroke-width="3"/><text x="170" y="105" fill="#4a9eed" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">ENGINEERING</text><rect x="50" y="112" width="240" height="2" rx="0" fill="#4a9eed" stroke="#4a9eed" stroke-width="0"/><text x="48" y="140" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">◆ Build systems & ship code</text><text x="48" y="184" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">◆ Connect APIs, write automation</text><text x="48" y="228" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">◆ Infrastructure that runs without you</text><text x="48" y="272" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">◆ Full-stack to data pipeline</text><rect x="360" y="75" width="280" height="310" rx="8" fill="#0e2016" stroke="#22c55e" stroke-width="3"/><text x="500" y="105" fill="#22c55e" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">GROWTH</text><rect x="380" y="112" width="240" height="2" rx="0" fill="#22c55e" stroke="#22c55e" stroke-width="0"/><text x="378" y="140" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">◆ Acquisition mechanics</text><text x="378" y="184" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">◆ Activation & retention loops</text><text x="378" y="228" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">◆ PLG + sales-assisted motions</text><text x="378" y="272" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">◆ Conversion rate optimization</text><rect x="690" y="75" width="280" height="310" rx="8" fill="#180e2a" stroke="#8b5cf6" stroke-width="3"/><text x="830" y="105" fill="#8b5cf6" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">REVENUE OPS</text><rect x="710" y="112" width="240" height="2" rx="0" fill="#8b5cf6" stroke="#8b5cf6" stroke-width="0"/><text x="708" y="140" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">◆ CRM architecture</text><text x="708" y="184" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">◆ Pipeline & lead routing</text><text x="708" y="228" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">◆ Attribution & forecasting</text><text x="708" y="272" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">◆ Sales automation design</text><rect x="335" y="262" width="330" height="78" rx="10" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="500" y="295" fill="#edd86e" font-size="17" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">GTM ENGINEER</text><text x="500" y="320" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">The connective layer</text><line x1="310" y1="301" x2="329" y2="301" stroke="#edd86e" stroke-width="2"/><polygon points="329,295 335,301 329,307" fill="#edd86e"/><line x1="640" y1="301" x2="659" y2="301" stroke="#edd86e" stroke-width="2"/><polygon points="659,295 665,301 659,307" fill="#edd86e"/><line x1="500" y1="385" x2="500" y2="344" stroke="#edd86e" stroke-width="2"/><polygon points="494,344 500,336 506,344" fill="#edd86e"/><rect x="30" y="410" width="940" height="55" rx="8" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="46" y="434" fill="#edd86e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Key insight:</text><text x="152" y="434" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">A GTM Engineer doesn't just advise on strategy. They build the systems that execute it.</text><text x="986" y="488" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.xyz</text></svg>