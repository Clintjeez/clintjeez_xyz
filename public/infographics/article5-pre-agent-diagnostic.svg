<svg width="1200" height="520" viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg"><rect width="1200" height="520" fill="#17181d"/><text x="30" y="38" fill="#edd86e" font-size="22" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">The Pre-Agent Diagnostic: 3 Checks Before You Buy an AI SDR</text><rect x="30" y="44" width="1140" height="2" rx="0" fill="#edd86e" stroke="#edd86e" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Applied from the Business Triangle — an AI SDR only amplifies whichever layer feeds it.</text>

<rect x="30" y="76" width="360" height="340" rx="8" fill="#241a08" stroke="#f59e0b" stroke-width="2"/><text x="210" y="106" fill="#f59e0b" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">INPUT CHECK</text><text x="210" y="126" fill="#777778" font-size="12" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Signal, or a cold list?</text><rect x="50" y="136" width="320" height="1" rx="0" fill="#f59e0b" stroke="#f59e0b" stroke-width="0"/><text x="52" y="164" fill="#f59e0b" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="76" y="164" fill="#ffffff" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">ICP built from real buying signals</text><text x="52" y="200" fill="#f59e0b" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="76" y="200" fill="#ffffff" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Enriched via Clay waterfall</text><text x="52" y="236" fill="#f59e0b" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="76" y="236" fill="#ffffff" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">List filtered before it's loaded</text><rect x="50" y="266" width="320" height="1" rx="0" fill="#3a2c10" stroke="#3a2c10" stroke-width="0"/><text x="52" y="296" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✗</text><text x="76" y="296" fill="#ef4444" font-size="12.5" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">FAIL SIGNAL:</text><text x="76" y="316" fill="#bfbfbf" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">"Just export the whole TAM</text><text x="76" y="334" fill="#bfbfbf" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">and let the agent go."</text>

<rect x="420" y="76" width="360" height="340" rx="8" fill="#0a1524" stroke="#3b82f6" stroke-width="2"/><text x="600" y="106" fill="#3b82f6" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">PROCESS CHECK</text><text x="600" y="126" fill="#777778" font-size="12" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">Proven by a human first?</text><rect x="440" y="136" width="320" height="1" rx="0" fill="#3b82f6" stroke="#3b82f6" stroke-width="0"/><text x="442" y="164" fill="#3b82f6" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="466" y="164" fill="#ffffff" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Sequence tested manually first</text><text x="442" y="200" fill="#3b82f6" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="466" y="200" fill="#ffffff" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Reply-rate baseline established</text><text x="442" y="236" fill="#3b82f6" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="466" y="236" fill="#ffffff" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Channel mix validated pre-scale</text><rect x="440" y="266" width="320" height="1" rx="0" fill="#0f2340" stroke="#0f2340" stroke-width="0"/><text x="442" y="296" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✗</text><text x="466" y="296" fill="#ef4444" font-size="12.5" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">FAIL SIGNAL:</text><text x="466" y="316" fill="#bfbfbf" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">The agent is running the</text><text x="466" y="334" fill="#bfbfbf" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">first version anyone wrote.</text>

<rect x="810" y="76" width="360" height="340" rx="8" fill="#180a24" stroke="#a855f7" stroke-width="2"/><text x="990" y="106" fill="#a855f7" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">OUTPUT CHECK</text><text x="990" y="126" fill="#777778" font-size="12" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">What happens after the meeting?</text><rect x="830" y="136" width="320" height="1" rx="0" fill="#a855f7" stroke="#a855f7" stroke-width="0"/><text x="832" y="164" fill="#a855f7" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="856" y="164" fill="#ffffff" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Demo-to-trial rate is healthy</text><text x="832" y="200" fill="#a855f7" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="856" y="200" fill="#ffffff" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Trial activation flow works</text><text x="832" y="236" fill="#a855f7" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✓</text><text x="856" y="236" fill="#ffffff" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Sales has capacity to follow up</text><rect x="830" y="266" width="320" height="1" rx="0" fill="#2a1040" stroke="#2a1040" stroke-width="0"/><text x="832" y="296" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">✗</text><text x="856" y="296" fill="#ef4444" font-size="12.5" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">FAIL SIGNAL:</text><text x="856" y="316" fill="#bfbfbf" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">More meetings just exposes</text><text x="856" y="334" fill="#bfbfbf" font-size="12.5" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">a funnel that already leaks.</text>

<rect x="30" y="436" width="1140" height="60" rx="8" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="46" y="461" fill="#edd86e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">The key insight:</text><text x="196" y="461" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">An AI SDR only amplifies what's already true about your funnel.</text><text x="46" y="481" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Fix the layer that's broken before you add volume to it.</text><text x="1186" y="510" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.com</text></svg>
