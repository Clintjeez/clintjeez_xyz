<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1200" height="500" rx="0" fill="#17181d" stroke="none" stroke-width="0"/><text x="30" y="38" fill="#edd86e" font-size="22" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">The Golden Benchmark Scorecard</text><rect x="30" y="44" width="1140" height="2" rx="0" fill="#edd86e" stroke="none" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Run your telemetry against these four thresholds before you scale acquisition spend.</text><rect x="30" y="90" width="284" height="36" rx="6" fill="#222326" stroke="#edd86e" stroke-width="1"/><text x="46" y="114" fill="#edd86e" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">METRIC</text><rect x="330" y="90" width="274" height="36" rx="6" fill="#222326" stroke="#edd86e" stroke-width="1"/><text x="346" y="114" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">DANGER ZONE</text><rect x="620" y="90" width="274" height="36" rx="6" fill="#222326" stroke="#edd86e" stroke-width="1"/><text x="636" y="114" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">GOOD BENCHMARK</text><rect x="910" y="90" width="254" height="36" rx="6" fill="#222326" stroke="#edd86e" stroke-width="1"/><text x="926" y="114" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">ELITE / WORLD CLASS</text><rect x="30" y="134" width="1140" height="74" rx="6" fill="#1c1c20" stroke="#2d2d38" stroke-width="1"/><text x="46" y="176" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">LTV : CAC Ratio</text><text x="346" y="176" fill="#ef4444" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Below 1:1 (losing money)</text><text x="636" y="176" fill="#f59e0b" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">3:1</text><text x="926" y="176" fill="#22c55e" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">5:1 or higher</text><rect x="30" y="216" width="1140" height="74" rx="6" fill="#1c1c20" stroke="#2d2d38" stroke-width="1"/><text x="46" y="258" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">CAC Payback Period</text><text x="346" y="258" fill="#ef4444" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Over 18 months</text><text x="636" y="258" fill="#f59e0b" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">8–12 months</text><text x="926" y="258" fill="#22c55e" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Under 6 months</text><rect x="30" y="298" width="1140" height="74" rx="6" fill="#1c1c20" stroke="#2d2d38" stroke-width="1"/><text x="46" y="340" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Net Revenue Retention</text><text x="346" y="340" fill="#ef4444" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Below 90%</text><text x="636" y="340" fill="#f59e0b" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">100–110% (SMB)</text><text x="926" y="340" fill="#22c55e" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">>120% (Enterprise)</text><rect x="30" y="380" width="1140" height="74" rx="6" fill="#1c1c20" stroke="#2d2d38" stroke-width="1"/><text x="46" y="422" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Monthly Logo Churn</text><text x="346" y="422" fill="#ef4444" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Over 5%/month</text><text x="636" y="422" fill="#f59e0b" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">1–2%/month</text><text x="926" y="422" fill="#22c55e" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Under 0.5%/month</text><rect x="30" y="430" width="1140" height="0" rx="8" fill="#17181d" stroke="none" stroke-width="0"/><text x="1170" y="484" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.com</text></svg>