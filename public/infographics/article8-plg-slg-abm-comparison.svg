<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="1200" height="560" rx="0" fill="#17181d" stroke="none" stroke-width="0"/><text x="30" y="38" fill="#edd86e" font-size="20" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Three Growth Engines: PLG, SLG, and the ABM Overlay</text><rect x="30" y="44" width="1140" height="2" rx="0" fill="#edd86e" stroke="none" stroke-width="0"/><text x="30" y="64" fill="#bfbfbf" font-size="13" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Pick the engine by ACV and buying complexity — not by which playbook is trending.</text><rect x="30" y="84" width="360" height="380" rx="8" fill="#0e2016" stroke="#22c55e" stroke-width="2"/><text x="210.0" y="116" fill="#22c55e" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">PLG</text><text x="210.0" y="136" fill="#777778" font-size="12" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">ACV < $2K/yr</text><rect x="50" y="146" width="320" height="1" fill="#22c55e"/><text x="54" y="178" fill="#22c55e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→</text><text x="76" y="178" fill="#ffffff" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Frictionless self-serve signup</text><text x="54" y="248" fill="#22c55e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→</text><text x="76" y="248" fill="#ffffff" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Product delivers the “aha” moment</text><text x="54" y="318" fill="#22c55e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→</text><text x="76" y="318" fill="#ffffff" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Viral invite loops drive expansion</text><text x="54" y="388" fill="#22c55e" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→</text><text x="76" y="388" fill="#ffffff" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Zero sales headcount required</text><rect x="420" y="84" width="360" height="380" rx="8" fill="#221808" stroke="#f59e0b" stroke-width="2"/><text x="600.0" y="116" fill="#f59e0b" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">HYBRID (PLG + Sales-Assist)</text><text x="600.0" y="136" fill="#777778" font-size="12" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">ACV $10K–$50K/yr</text><rect x="440" y="146" width="320" height="1" fill="#f59e0b"/><text x="444" y="178" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→</text><text x="466" y="178" fill="#ffffff" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Free trial or freemium collects signups</text><text x="444" y="248" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→</text><text x="466" y="248" fill="#ffffff" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Telemetry flags high-intent power users</text><text x="444" y="318" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→</text><text x="466" y="318" fill="#ffffff" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Inside rep closes the upgrade</text><text x="444" y="388" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→</text><text x="466" y="388" fill="#ffffff" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Product proves fit before sales engages</text><rect x="810" y="84" width="360" height="380" rx="8" fill="#180e2a" stroke="#8b5cf6" stroke-width="2"/><text x="990.0" y="116" fill="#8b5cf6" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">SLG + ABM</text><text x="990.0" y="136" fill="#777778" font-size="12" font-weight="normal" text-anchor="middle" font-family="'Roboto Mono','Courier New',monospace">ACV $100K+/yr</text><rect x="830" y="146" width="320" height="1" fill="#8b5cf6"/><text x="834" y="178" fill="#8b5cf6" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→</text><text x="856" y="178" fill="#ffffff" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Named target account list, not a net</text><text x="834" y="248" fill="#8b5cf6" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→</text><text x="856" y="248" fill="#ffffff" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Reverse-IP triggers personalized site</text><text x="834" y="318" fill="#8b5cf6" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→</text><text x="856" y="318" fill="#ffffff" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">AE-led demos, security review, procurement</text><text x="834" y="388" fill="#8b5cf6" font-size="13" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">→</text><text x="856" y="388" fill="#ffffff" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">Champion + economic buyer both mapped</text><rect x="30" y="476" width="1140" height="62" rx="8" fill="#222326" stroke="#edd86e" stroke-width="2"/><text x="50" y="500" fill="#edd86e" font-size="12" font-weight="bold" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">THE KEY INSIGHT:</text><text x="50" y="520" fill="#bfbfbf" font-size="12" font-weight="normal" text-anchor="start" font-family="'Roboto Mono','Courier New',monospace">The engine isn’t a philosophy you pick. It’s a function of your ACV — the wrong engine for your price point burns cash regardless of execution quality.</text><text x="1170" y="545" fill="#777778" font-size="11" font-weight="normal" text-anchor="end" font-family="'Roboto Mono','Courier New',monospace">clintjeez.com</text></svg>