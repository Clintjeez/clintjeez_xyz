<!doctype html>
<html><head><meta charset="utf-8"><title>Post 3 Data</title>
<link rel="stylesheet" href="base.css">
<style>
  .canvas { width: 1200px; height: 628px; --glow-x: 14%; --glow-y: 85%; }
  .portrait { left: -10px; bottom: 0; width: 360px; height: 470px; background-image: url(portrait-bw.png); }
  .kicker { position: absolute; top: 40px; left: 40px; font-size: 13px; color: var(--gold); }
  .who { position: absolute; left: 40px; top: 66px; font-family: 'Playfair Display', serif; }
  .who b { display: block; font-size: 22px; }
  .who i { font-size: 15px; color: var(--muted); }

  .right { position: absolute; left: 380px; top: 36px; right: 44px; }
  h1 { font-size: 44px; font-weight: 800; line-height: 1.02; letter-spacing: -0.025em; }
  h1 em { color: var(--gold); font-style: italic; }
  .sub { font-size: 14px; color: var(--muted); margin-top: 10px; }

  svg.chart { position: absolute; left: 400px; top: 150px; }
  .handle { position: absolute; right: 44px; bottom: 26px; font-size: 14px; }
  .formula { position: absolute; left: 400px; bottom: 26px; font-size: 13px; color: var(--muted); }
  .formula b { color: var(--text-2); font-weight: 500; }
</style></head>
<body><div class="canvas">
  <div class="kicker caps">Data drop · NRR</div>
  <div class="who"><b>Clinton James</b><i>AI &amp; Growth Systems Engineer</i></div>
  <div class="portrait"></div>

  <div class="right">
    <h1 class="serif">Same $100K cohort. Zero new spend.<br>A <em>2.4x</em> gap in three years.</h1>
  </div>

  <!-- y(v) = 380 - (v - 60) * 2.5 ; x: year0=70, 1=270, 2=470, 3=670 -->
  <svg class="chart" width="740" height="398" viewBox="0 0 776 418" font-family="Roboto Mono">
    <defs>
      <linearGradient id="up" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edd86e" stop-opacity="0.28"/><stop offset="1" stop-color="#edd86e" stop-opacity="0"/></linearGradient>
    </defs>
    <g stroke="#ffffff12">
      <line x1="70" y1="80" x2="680" y2="80"/><line x1="70" y1="180" x2="680" y2="180"/>
      <line x1="70" y1="280" x2="680" y2="280"/><line x1="70" y1="380" x2="680" y2="380" stroke="#ffffff30"/>
    </g>
    <g fill="#777778" font-size="12" text-anchor="end">
      <text x="58" y="84">$180K</text><text x="58" y="184">$140K</text><text x="58" y="284">$100K</text><text x="58" y="384">$60K</text>
    </g>
    <g fill="#777778" font-size="12" text-anchor="middle">
      <text x="70" y="400">START</text><text x="270" y="400">YEAR 1</text><text x="470" y="400">YEAR 2</text><text x="670" y="400">YEAR 3</text>
    </g>

    <!-- 120%: 100,120,144,172.8 -->
    <path d="M70 280 L270 230 L470 170 L670 98 L670 380 L70 380 Z" fill="url(#up)"/>
    <path d="M70 280 L270 230 L470 170 L670 98" fill="none" stroke="#edd86e" stroke-width="4" stroke-linejoin="round"/>
    <!-- 90%: 100,90,81,72.9 -->
    <path d="M70 280 L270 305 L470 327.5 L670 347.75" fill="none" stroke="#b5544c" stroke-width="4" stroke-dasharray="10 7" stroke-linejoin="round"/>

    <g fill="#edd86e"><circle cx="270" cy="230" r="5"/><circle cx="470" cy="170" r="5"/><circle cx="670" cy="98" r="7"/></g>
    <g fill="#e0928b"><circle cx="270" cy="305" r="5"/><circle cx="470" cy="327.5" r="5"/><circle cx="670" cy="347.75" r="7"/></g>
    <circle cx="70" cy="280" r="6" fill="#ffffff"/>

    <!-- gap bracket -->
    <line x1="700" y1="98" x2="700" y2="347.75" stroke="#bfbfbf" stroke-dasharray="3 5"/>
    <line x1="694" y1="98" x2="706" y2="98" stroke="#bfbfbf"/><line x1="694" y1="347.75" x2="706" y2="347.75" stroke="#bfbfbf"/>
    <text x="712" y="230" fill="#ffffff" font-family="Playfair Display" font-weight="800" font-size="34">2.4x</text>

    <text x="560" y="74" fill="#edd86e" font-size="15" font-weight="700" text-anchor="end">$172.8K</text>
    <text x="560" y="92" fill="#edd86e" font-size="12" text-anchor="end" opacity="0.8">120% NRR · compounding</text>
    <text x="560" y="372" fill="#e0928b" font-size="15" font-weight="700" text-anchor="end">$72.9K</text>
    <text x="560" y="355" fill="#e0928b" font-size="12" text-anchor="end" opacity="0.8">90% NRR · treadmill</text>
  </svg>

  <div class="formula">NRR = <b>(Start MRR + Expansion − Downgrades − Churn) ÷ Start MRR</b></div>
  <div class="handle handle"><b>@</b>ClintJeezz</div>
</div></body></html>
